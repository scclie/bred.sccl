<extend template="base.shtml">
<head id="head">
  <meta property="og:type" content="website">
</head>
<main id="content">
  <div class="page-content">
    <header>
      <h1 :text="$page.title"></h1>
      <ctx :if="$page.description.len().gt(0)">
        <p :text="$page.description"></p>
      </ctx>
    </header>
    <ctx :if="$page.content().len().gt(0)">
      <div :html="$page.content()"></div>
    </ctx>
  </div>
  <div class="module-recents">
    <ctx :if="$page.leaves().len.gt(0)">
      <ctx :loop="$page.leaves()">
        <article class="recent-item">
          <a href="$loop.it.link()" :text="$loop.it.title"></a>
          <time class="recent-meta" :text="$loop.it.date.format('2006-01-02')"></time>
          <ctx :if="$loop.it.description.len().gt(0)">
            <p :text="$loop.it.description"></p>
          </ctx>
        </article>
      </ctx>
    </ctx>
  </div>
</main>
